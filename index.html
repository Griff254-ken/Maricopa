
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17191b">

<title>Maricopa Concrete | Loading</title>

<style>
/* ================================
   MARICOPA CONCRETE LOADING SCREEN
================================ */

:root {
    --orange: #f28c28;
    --orange-light: #ffb454;
    --dark: #17191b;
    --dark-light: #24272a;
    --white: #ffffff;
    --gray: #a9adb1;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--dark);
    color: var(--white);
    overflow: hidden;
}

/* MAIN BACKGROUND */

.loading-screen {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(
            circle at 50% 45%,
            #36393c 0%,
            #25282b 35%,
            #17191b 75%
        );
}

/* Concrete texture */

.loading-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    opacity: 0.17;

    background-image:
        url("https://www.transparenttextures.com/patterns/concrete-wall.png");

    background-repeat: repeat;
    animation: textureMove 20s linear infinite;
}

/* Industrial lighting */

.loading-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            transparent 20%,
            rgba(242, 140, 40, 0.04) 45%,
            transparent 70%
        ),
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0, 0, 0, 0.65) 100%
        );
}

/* BACKGROUND STEEL */

.steel-bars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.18;
    z-index: -1;
}

.steel-bar {
    position: absolute;
    width: 150%;
    height: 8px;
    left: -25%;

    background:
        repeating-linear-gradient(
            90deg,
            #777d82 0px,
            #a6adb2 3px,
            #454a4f 6px,
            #777d82 12px
        );

    border-top: 1px solid #b7bec3;
    border-bottom: 1px solid #34383c;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.2);
}

.steel-bar:nth-child(1) {
    top: 15%;
    transform: rotate(-18deg);
    animation: steelMove1 12s ease-in-out infinite alternate;
}

.steel-bar:nth-child(2) {
    top: 40%;
    transform: rotate(15deg);
    animation: steelMove2 15s ease-in-out infinite alternate;
}

.steel-bar:nth-child(3) {
    top: 70%;
    transform: rotate(-12deg);
    animation: steelMove1 18s ease-in-out infinite alternate;
}

.steel-bar:nth-child(4) {
    top: 90%;
    transform: rotate(20deg);
    animation: steelMove2 13s ease-in-out infinite alternate;
}

/* FLOATING CONCRETE PARTICLES */

.particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.particle {
    position: absolute;
    bottom: -30px;

    width: var(--size, 6px);
    height: var(--size, 6px);

    background: #aaa9a4;
    border-radius: 50%;

    opacity: 0;
    animation: particleFloat var(--duration, 8s) linear infinite;
    animation-delay: var(--delay, 0s);
}

/* MAIN CONTENT */

.content {
    position: relative;
    z-index: 5;

    width: 100%;
    max-width: 650px;
    padding: 25px;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;
}

/* BRAND */

.brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;

    margin-bottom: 12px;

    animation: brandAppear 1s ease-out both;
}

.brand-symbol {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--orange);
    color: #17191b;

    font-size: 25px;
    font-weight: 900;

    clip-path: polygon(
        25% 0,
        75% 0,
        100% 50%,
        75% 100%,
        25% 100%,
        0 50%
    );
}

.brand-name {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.brand-name span {
    color: var(--orange);
}

.brand-subtitle {
    margin-top: 5px;

    color: #aeb2b5;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* GEAR MECHANISM */

.machine {
    position: relative;

    width: 270px;
    height: 270px;

    margin: 25px 0 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation: machineAppear 1.2s ease-out both;
}

/* Outer gear */

.gear {
    position: absolute;

    width: 230px;
    height: 230px;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            from 0deg,
            #9b9fa2 0deg 8deg,
            #45494c 8deg 15deg,
            #73777a 15deg 22.5deg
        );

    -webkit-mask:
        radial-gradient(
            circle,
            transparent 0 48%,
            #000 49% 72%,
            transparent 73%
        );

    mask:
        radial-gradient(
            circle,
            transparent 0 48%,
            #000 49% 72%,
            transparent 73%
        );

    filter:
        drop-shadow(0 8px 8px rgba(0, 0, 0, 0.5));

    animation: gearRotate 12s linear infinite;
}

/* Inner rotating wheel */

.gear-inner {
    position: absolute;

    width: 145px;
    height: 145px;

    border-radius: 50%;

    border: 12px solid #5e6367;

    background:
        repeating-conic-gradient(
            #747a7e 0deg 8deg,
            #33383c 8deg 16deg
        );

    box-shadow:
        inset 0 0 0 5px #292d30,
        inset 0 0 15px rgba(0, 0, 0, 0.7),
        0 0 15px rgba(0, 0, 0, 0.5);

    animation: gearRotateReverse 8s linear infinite;
}

/* Center mixer wheel */

.mixer-wheel {
    position: absolute;

    width: 95px;
    height: 95px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #f6a447,
            #b96816 55%,
            #f28c28
        );

    border: 7px solid #383c3f;

    box-shadow:
        inset 0 0 0 3px #f9b25d,
        0 0 20px rgba(242, 140, 40, 0.25);

    display: flex;
    align-items: center;
    justify-content: center;

    animation: mixerRotate 5s linear infinite;
}

.mixer-wheel::before,
.mixer-wheel::after {
    content: "";
    position: absolute;

    width: 12px;
    height: 62px;

    background: #373b3e;
    border-radius: 5px;

    box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.08);
}

.mixer-wheel::after {
    transform: rotate(90deg);
}

.mixer-center {
    position: relative;
    z-index: 2;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: #c9cdd0;
    border: 5px solid #383c3f;
}

/* Small side gears */

.small-gear {
    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background:
        repeating-conic-gradient(
            #8d9296 0deg 12deg,
            #45494c 12deg 24deg
        );

    -webkit-mask:
        radial-gradient(
            circle,
            transparent 0 28%,
            #000 29% 75%,
            transparent 76%
        );

    mask:
        radial-gradient(
            circle,
            transparent 0 28%,
            #000 29% 75%,
            transparent 76%
        );

    filter: drop-shadow(0 4px 4px #000);
}

.small-gear.left {
    left: 0;
    bottom: 28px;

    animation: gearRotateReverse 5s linear infinite;
}

.small-gear.right {
    right: 0;
    top: 28px;

    animation: gearRotate 5s linear infinite;
}

/* CONCRETE MIXING EFFECT */

.concrete-flow {
    position: absolute;

    width: 160px;
    height: 160px;

    border-radius: 50%;

    border: 1px dashed rgba(242, 140, 40, 0.35);

    animation: gearRotateReverse 20s linear infinite;
}

.concrete-flow::before,
.concrete-flow::after {
    content: "";
    position: absolute;

    width: 9px;
    height: 9px;

    border-radius: 50%;
    background: var(--orange);

    box-shadow:
        0 0 10px rgba(242, 140, 40, 0.7);
}

.concrete-flow::before {
    top: 15px;
    left: 30px;
}

.concrete-flow::after {
    bottom: 20px;
    right: 25px;
}

/* LOADING TEXT */

.loading-title {
    margin-top: 10px;

    font-size: clamp(17px, 3vw, 22px);
    font-weight: 800;

    letter-spacing: 3px;
    text-transform: uppercase;

    animation: textAppear 1s ease-out both;
}

.loading-title span {
    color: var(--orange);
}

.loading-description {
    margin-top: 12px;

    color: var(--gray);

    font-size: 13px;
    letter-spacing: 1px;
    line-height: 1.7;
}

/* PROGRESS BAR */

.progress-container {
    width: min(100%, 340px);

    margin-top: 30px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;

    color: #b8bdc1;

    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

#progressPercent {
    color: var(--orange);
    font-weight: 800;
    font-size: 14px;
}

.progress-track {
    width: 100%;
    height: 5px;

    background: #34383b;

    border-radius: 20px;
    overflow: hidden;

    box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.6);
}

.progress-fill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #bd6b19,
            #f28c28,
            #ffc16f
        );

    border-radius: 20px;

    box-shadow:
        0 0 12px rgba(242, 140, 40, 0.5);

    transition: width 0.15s linear;
}

/* LOADING STATUS */

.status {
    margin-top: 18px;

    color: #858b90;

    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.status::after {
    content: "";
    display: inline-block;

    width: 18px;
    text-align: left;

    animation: dots 1.4s steps(4, end) infinite;
}

/* FOOTER */

.footer {
    position: absolute;
    bottom: 25px;

    width: 100%;
    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #70767a;

    font-size: 10px;
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
}

.footer span {
    color: var(--orange);
    margin: 0 5px;
}

/* ANIMATIONS */

@keyframes gearRotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes gearRotateReverse {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes mixerRotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(-360deg);
    }
}

@keyframes particleFloat {
    0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 0.5;
    }

    70% {
        opacity: 0.25;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(var(--drift, 50px))
            rotate(360deg);

        opacity: 0;
    }
}

@keyframes steelMove1 {
    from {
        margin-left: -30px;
    }

    to {
        margin-left: 50px;
    }
}

@keyframes steelMove2 {
    from {
        margin-left: 40px;
    }

    to {
        margin-left: -40px;
    }
}

@keyframes textureMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 200px 200px;
    }
}

@keyframes brandAppear {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes machineAppear {
    from {
        opacity: 0;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes dots {
    0% {
        content: "";
    }

    25% {
        content: ".";
    }

    50% {
        content: "..";
    }

    75% {
        content: "...";
    }
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 480px) {
    .machine {
        width: 230px;
        height: 230px;
        margin: 20px 0;
        transform: scale(0.9);
    }

    .gear {
        width: 200px;
        height: 200px;
    }

    .gear-inner {
        width: 125px;
        height: 125px;
    }

    .mixer-wheel {
        width: 85px;
        height: 85px;
    }

    .brand-symbol {
        width: 40px;
        height: 40px;
        font-size: 21px;
    }

    .brand-name {
        font-size: 23px;
    }

    .brand-subtitle {
        font-size: 8px;
        letter-spacing: 3px;
    }

    .loading-description {
        font-size: 11px;
    }

    .footer {
        bottom: 15px;
        font-size: 8px;
        letter-spacing: 1px;
    }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="loading-screen">

    <!-- Background steel bars -->
    <div class="steel-bars">
        <div class="steel-bar"></div>
        <div class="steel-bar"></div>
        <div class="steel-bar"></div>
        <div class="steel-bar"></div>
    </div>

    <!-- Concrete particles -->
    <div class="particles" id="particles"></div>

    <!-- Main content -->
    <main class="content">

        <!-- Company branding -->
        <div class="brand">

            <div class="brand-symbol">
                M
            </div>

            <div>
                <div class="brand-name">
                    MARICOPA <span>CONCRETE</span>
                </div>

                <div class="brand-subtitle">
                    Strength in Every Structure
                </div>
            </div>

        </div>

        <!-- Animated industrial machine -->
        <div class="machine">

            <div class="gear"></div>

            <div class="gear-inner"></div>

            <div class="small-gear left"></div>

            <div class="small-gear right"></div>

            <div class="concrete-flow"></div>

            <div class="mixer-wheel">
                <div class="mixer-center"></div>
            </div>

        </div>

        <!-- Loading text -->
        <h1 class="loading-title">
            Building <span>Strength</span>
        </h1>

        <p class="loading-description">
            Preparing your construction materials marketplace.<br>
            Quality concrete products. Reliable service.
        </p>

        <!-- Progress bar -->
        <div class="progress-container">

            <div class="progress-info">
                <span>Loading your experience</span>
                <span id="progressPercent">0%</span>
            </div>

            <div
                class="progress-track"
                role="progressbar"
                aria-label="Loading"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                id="progressBar"
            >
                <div class="progress-fill" id="progressFill"></div>
            </div>

        </div>

        <div class="status" id="loadingStatus">
            Initializing system
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        MARICOPA CONCRETE <span>•</span> Built on Quality
    </footer>

</div>

<script>
/* =================================
   MARICOPA CONCRETE LOADING SCRIPT
================================= */

(function () {
    "use strict";

    const progressFill = document.getElementById("progressFill");
    const progressPercent = document.getElementById("progressPercent");
    const progressBar = document.getElementById("progressBar");
    const loadingStatus = document.getElementById("loadingStatus");
    const particlesContainer = document.getElementById("particles");

    // Dashboard destination
    const DASHBOARD_URL = "dash.html";

    // Total loading duration in milliseconds
    const LOADING_DURATION = 5000;

    // Loading status messages
    const statusMessages = [
        {
            progress: 0,
            text: "Initializing system"
        },
        {
            progress: 20,
            text: "Preparing concrete materials"
        },
        {
            progress: 40,
            text: "Calibrating industrial machinery"
        },
        {
            progress: 60,
            text: "Connecting marketplace"
        },
        {
            progress: 80,
            text: "Preparing your dashboard"
        },
        {
            progress: 100,
            text: "Ready to build"
        }
    ];

    // Create floating concrete particles
    function createParticles() {

        const particleCount = 35;

        for (let i = 0; i < particleCount; i++) {

            const particle = document.createElement("div");

            particle.className = "particle";

            const size = Math.random() * 7 + 2;
            const duration = Math.random() * 8 + 6;
            const delay = Math.random() * 10;
            const drift = Math.random() * 150 - 75;

            particle.style.left = Math.random() * 100 + "%";

            particle.style.setProperty(
                "--size",
                size + "px"
            );

            particle.style.setProperty(
                "--duration",
                duration + "s"
            );

            particle.style.setProperty(
                "--delay",
                "-" + delay + "s"
            );

            particle.style.setProperty(
                "--drift",
                drift + "px"
            );

            particlesContainer.appendChild(particle);
        }
    }

    // Update progress bar
    function updateProgress(progress) {

        const percentage = Math.min(
            100,
            Math.max(0, Math.floor(progress))
        );

        progressFill.style.width = percentage + "%";

        progressPercent.textContent = percentage + "%";

        progressBar.setAttribute(
            "aria-valuenow",
            percentage
        );

        // Update loading message
        let currentMessage = statusMessages[0];

        for (const message of statusMessages) {

            if (percentage >= message.progress) {
                currentMessage = message;
            }
        }

        loadingStatus.textContent = currentMessage.text;
    }

    // Start loading animation
    function startLoading() {

        const startTime = performance.now();

        function animate(currentTime) {

            const elapsed = currentTime - startTime;

            const progress = Math.min(
                100,
                (elapsed / LOADING_DURATION) * 100
            );

            updateProgress(progress);

            if (progress < 100) {

                requestAnimationFrame(animate);

            } else {

                // Ensure the progress bar is fully complete
                updateProgress(100);

                loadingStatus.textContent = "Welcome to Maricopa Concrete";

                // Redirect to dashboard
                setTimeout(function () {

                    window.location.replace(DASHBOARD_URL);

                }, 500);
            }
        }

        requestAnimationFrame(animate);
    }

    // Initialize loading screen
    function initialize() {

        createParticles();

        startLoading();
    }

    // Start when the page is ready
    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            initialize
        );

    } else {

        initialize();
    }

})();
</script>

</body>
</html>
