<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="color-scheme" content="dark">
<title>Maricopa Concrete &amp; Allied</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f97316'/%3E%3Cpath d='M14 48V16h8l10 16 10-16h8v32h-8V31L32 46 22 31v17z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="prefetch" href="dash.html">
<noscript><meta http-equiv="refresh" content="1;url=dash.html"></noscript>
<style>
:root{
  --acc:#f97316;--acc-d:#ea580c;--acc-l:#fdba74;
  --dark:#14161a;--dark2:#1f2329;--ink:#f3f1ed;--mute:#9aa0aa;
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  /* ---- OPTIONAL BACKGROUND PHOTO ----
     Put a photo next to this file (e.g. site.jpg) and use:
       --splash-image: url("site.jpg");
     A dark overlay keeps everything readable. */
  --splash-image:none;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{background:var(--dark);color:var(--ink);font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

.screen{position:relative;width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b));overflow:hidden;isolation:isolate;
  background:
    linear-gradient(rgba(20,22,26,.82),rgba(20,22,26,.9)),
    var(--splash-image) center/cover no-repeat,
    radial-gradient(circle at 50% 38%,#2c3037 0%,#1b1e23 45%,#14161a 80%)}

/* soft orange glow + fine grid texture (all CSS, no external files) */
.screen::before{content:"";position:absolute;left:50%;top:38%;width:min(120vw,780px);height:min(120vw,780px);transform:translate(-50%,-50%);border-radius:50%;z-index:-2;background:radial-gradient(circle,rgba(249,115,22,.22),transparent 62%);animation:glow 4s ease-in-out infinite}
.screen::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 44px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 44px);
  -webkit-mask:radial-gradient(circle at 50% 40%,#000,transparent 75%);mask:radial-gradient(circle at 50% 40%,#000,transparent 75%)}
@keyframes glow{50%{opacity:.65;transform:translate(-50%,-50%) scale(1.08)}}

.dust{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.dust i{position:absolute;bottom:-20px;width:var(--s,4px);height:var(--s,4px);border-radius:50%;background:rgba(253,186,116,.55);opacity:0;animation:rise var(--d,9s) linear infinite;animation-delay:var(--l,0s)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}80%{opacity:.25}100%{transform:translate(var(--x,30px),-105vh);opacity:0}}

.content{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* logo with progress ring */
.mark{position:relative;width:148px;height:148px;display:grid;place-items:center;animation:pop .9s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}}
.mark svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.mark .tr{fill:none;stroke:rgba(255,255,255,.1);stroke-width:5}
.mark .pr{fill:none;stroke:url(#g);stroke-width:5;stroke-linecap:round;stroke-dasharray:408;stroke-dashoffset:408;filter:drop-shadow(0 0 8px rgba(249,115,22,.6))}
.tile{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;font-size:3rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#fb923c,var(--acc-d));box-shadow:0 16px 40px rgba(249,115,22,.4),inset 0 1px 0 rgba(255,255,255,.35);animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}

.name{margin-top:28px;font-size:clamp(1.5rem,6vw,2rem);font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:1.1;animation:up .8s .15s var(--ease) both}
.name span{color:var(--acc)}
.sub{margin-top:8px;font-size:.66rem;font-weight:600;color:var(--mute);letter-spacing:.32em;text-transform:uppercase;animation:up .8s .25s var(--ease) both}
.tag{margin-top:22px;color:#d5d8de;font-size:1rem;line-height:1.6;max-width:32ch;animation:up .8s .35s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}

.bar{width:min(100%,320px);margin-top:34px;animation:up .8s .45s var(--ease) both}
.track{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--acc-d),var(--acc),var(--acc-l));box-shadow:0 0 14px rgba(249,115,22,.55);position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 1.3s linear infinite}
@keyframes shine{to{transform:translateX(100%)}}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.8rem;color:var(--mute)}
.meta b{color:var(--acc);font-variant-numeric:tabular-nums;font-size:.9rem}

.go{margin-top:22px;color:var(--mute);font-size:.82rem;text-decoration:none;padding:12px 18px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;transition:color .2s,background .2s;animation:up .8s .6s var(--ease) both}
.go:hover,.go:focus-visible{color:#fff;background:rgba(255,255,255,.08);outline:none}

.foot{position:absolute;left:0;right:0;bottom:calc(20px + var(--safe-b));display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;padding:0 20px;color:#7d838d;font-size:.74rem;text-align:center;animation:up .8s .7s var(--ease) both}

@media(max-width:480px){
  .mark{width:128px;height:128px}.tile{width:80px;height:80px;font-size:2.6rem;border-radius:24px}
  .name{margin-top:24px}.tag{font-size:.94rem}
}
@media(max-height:560px){
  .mark{width:96px;height:96px}.tile{width:60px;height:60px;font-size:1.9rem;border-radius:18px}
  .name{margin-top:14px}.tag{display:none}.bar{margin-top:18px}.foot,.go{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}.dust{display:none}}
</style>
</head>
<body>

<div class="screen">
  <div class="dust" id="dust" aria-hidden="true"></div>

  <main class="content">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 148 148">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#fdba74"/></linearGradient></defs>
        <circle class="tr" cx="74" cy="74" r="65"/>
        <circle class="pr" id="ring" cx="74" cy="74" r="65"/>
      </svg>
      <div class="tile">M</div>
    </div>

    <h1 class="name">Maricopa <span>Concrete</span></h1>
    <div class="sub">&amp; Allied</div>
    <p class="tag">Quality building materials, ordered in minutes and delivered to your site.</p>

    <div class="bar">
      <div class="track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div class="fill" id="fill"></div></div>
      <div class="meta"><span id="msg">Getting things ready…</span><b id="pct">0%</b></div>
    </div>

    <a class="go" href="dash.html" id="go">Continue now →</a>
  </main>

  <div class="foot"><span>🚚 Delivery to your site</span><span>📲 Pay easily with M-Pesa</span></div>
</div>

<script>
(function(){
  "use strict";
  var DEST="dash.html";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DURATION=reduce?700:3200;           /* how long the screen shows, in ms */
  var $=function(i){return document.getElementById(i)};
  var fill=$("fill"),pct=$("pct"),pb=$("pb"),msg=$("msg"),ring=$("ring"),CIRC=408;
  var steps=[[0,"Getting things ready…"],[30,"Loading our products…"],[60,"Setting up your store…"],[88,"Almost there…"],[100,"Welcome!"]];
  var done=false;

  /* gentle floating dust */
  if(!reduce){
    var box=$("dust");
    for(var i=0;i<22;i++){
      var d=document.createElement("i");
      d.style.left=Math.random()*100+"%";
      d.style.setProperty("--s",(Math.random()*4+2)+"px");
      d.style.setProperty("--d",(Math.random()*8+7)+"s");
      d.style.setProperty("--l","-"+(Math.random()*12)+"s");
      d.style.setProperty("--x",(Math.random()*120-60)+"px");
      box.appendChild(d);
    }
  }

  function go(){
    if(done)return;done=true;
    try{window.location.replace(DEST)}catch(e){window.location.href=DEST}
  }
  $("go").addEventListener("click",function(e){e.preventDefault();go()});

  function paint(p){
    p=Math.max(0,Math.min(100,p));
    var n=Math.floor(p);
    fill.style.width=p+"%";
    ring.style.strokeDashoffset=CIRC*(1-p/100);
    pct.textContent=n+"%";
    pb.setAttribute("aria-valuenow",n);
    for(var i=steps.length-1;i>=0;i--){if(n>=steps[i][0]){msg.textContent=steps[i][1];break}}
  }
  /* ease-out so it feels quick at first and settles smoothly */
  var ease=function(t){return 1-Math.pow(1-t,2.2)};

  var t0=null;
  function frame(ts){
    if(t0===null)t0=ts;
    var t=Math.min(1,(ts-t0)/DURATION);
    paint(ease(t)*100);
    if(t<1)requestAnimationFrame(frame);
    else{paint(100);setTimeout(go,reduce?0:450)}
  }
  requestAnimationFrame(frame);

  /* safety net: if animation frames are paused (background tab), still continue */
  setTimeout(go,DURATION+4000);
})();
</script>
</body>
</html>
